[build]
builder = "DOCKERFILE"
dockerfilePath = "workers/hq/Dockerfile"
watchPatterns = ["/workers/hq/**"]

[deploy]
restartPolicyType = "NEVER"
numReplicas = 1
# Oday approved the bounded daily check after the first verified cloud run.
# No new approved input means no model call.
cronSchedule = "0 6 * * *"
