name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: traceli_agent_demo
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d traceli_agent_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/traceli_agent_demo
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/traceli_agent_demo
      TRACELI_SEED_ORGANIZATION_ID: org_traceli_relief
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate environment contract
        run: pnpm validate:env
      - name: Type-check
        run: pnpm typecheck
      - name: Build production application
        run: pnpm build
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Seed isolated tenants
        run: pnpm db:seed
      - name: Test tenant and audit boundaries
        run: pnpm test:tenant
      - name: Test read-only evidence tools against fictional records
        run: pnpm test:agent
        env:
          TRACELI_AGENT_FIXTURE: '1'

      - name: Test HQ feed compatibility and task links
        run: pnpm test:hq:feed
      - name: Create isolated HQ planning fixture database
        run: createdb -h 127.0.0.1 -U postgres traceli_hq_test
        env:
          PGPASSWORD: postgres
      - name: Test task planning metadata database boundary
        run: pnpm db:migrate && pnpm test:hq:planning
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@127.0.0.1:5432/traceli_hq_test
          HQ_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/traceli_hq_test

  supply-chain:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
