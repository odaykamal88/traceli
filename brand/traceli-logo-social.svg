<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048" fill="none">
  <title>Traceli logo</title>
  <desc>Traceli waypoints mark in cream and teal on a deep navy background.</desc>
  <defs>
    <linearGradient id="background" x1="236" y1="184" x2="1836" y2="1904" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061A33"/>
      <stop offset="0.58" stop-color="#0B2D49"/>
      <stop offset="1" stop-color="#0D3F51"/>
    </linearGradient>
    <linearGradient id="diamond" x1="700" y1="684" x2="1340" y2="1374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D3953"/>
      <stop offset="1" stop-color="#071D39"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1392 1384) rotate(-137.5) scale(1132)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78D8C4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#78D8C4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="450" y="444" width="1148" height="1168" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="42" stdDeviation="42" flood-color="#000A18" flood-opacity="0.38"/>
    </filter>
    <filter id="dot-glow" x="1150" y="630" width="272" height="272" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="2048" height="2048" fill="url(#background)"/>
  <rect width="2048" height="2048" fill="url(#halo)"/>

  <g filter="url(#shadow)">
    <rect x="664" y="664" width="720" height="720" rx="160" transform="rotate(45 1024 1024)" fill="url(#diamond)" stroke="#8BE1CF" stroke-opacity="0.72" stroke-width="14"/>
    <rect x="758" y="758" width="532" height="532" rx="98" transform="rotate(45 1024 1024)" stroke="#FBF5EA" stroke-opacity="0.24" stroke-width="12"/>
  </g>

  <g transform="translate(808 808) scale(18)" stroke="#FBF5EA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m10.586 5.414-5.172 5.172"/>
    <path d="m18.586 13.414-5.172 5.172"/>
    <path d="M6 12h12"/>
    <circle cx="12" cy="20" r="2"/>
    <circle cx="12" cy="4" r="2"/>
    <circle cx="20" cy="12" r="2"/>
    <circle cx="4" cy="12" r="2"/>
  </g>

  <circle cx="1284" cy="764" r="104" fill="#78D8C4" fill-opacity="0.55" filter="url(#dot-glow)"/>
  <circle cx="1284" cy="764" r="60" fill="#78D8C4" stroke="#061A33" stroke-width="18"/>
</svg>
